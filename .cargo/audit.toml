# cargo-audit's settings. An advisory nothing can be done about here is
# listed with why, so that the scan stays clean and the reasoning is kept
# where the next person to run it will read it.

[advisories]
ignore = [
    # RUSTSEC-2023-0071, the Marvin attack on `rsa`: a timing side channel in
    # RSA private-key operations. `rsa` comes in through `openidconnect`, which
    # uses it only to verify an identity provider's signature with the
    # provider's public key; this server holds no RSA private key, so there is
    # nothing for the timing to recover. No fixed release of `rsa` exists.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0367, -0368 and -0369, in `zip`'s extraction: SUID and SGID
    # bits kept, symbolic links led out of the destination, permissions applied
    # through them. `zip` 8 is a build dependency of `utoipa-swagger-ui`, whose
    # build script opens one archive — the Swagger UI vendored in
    # `utoipa-swagger-ui-vendored`, a crate Cargo.lock pins by checksum, which
    # nobody else supplies — and writes its files itself, by `enclosed_name`,
    # never through `ZipArchive::extract`. The fixed `zip` 9 is not one that
    # utoipa-swagger-ui 10.0.1, the latest, takes; drop these once it does.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # RUSTSEC-2024-0436, `paste` unmaintained: a proc-macro rav1e — the AVIF
    # encoder of the night's copies — runs at build time to paste identifiers
    # together. Nothing of it is in the binary, it is finished rather than
    # broken, and rav1e 0.8.1, the latest, still uses it. Kept in step with
    # deny.toml.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2026-0387, timing variability in `crypto-bigint` 0.5's
    # arithmetic on secret integers. It comes in through `p256`, which this
    # server uses on public values alone: `openidconnect` verifies an
    # identity provider's ES256 signatures with its public key, and `age`
    # encrypts the backups with a passphrase, never with a P-256 key. The
    # fixed 0.7.6 needs `p256` 0.14, which neither takes yet; drop this once
    # they do. Kept in step with deny.toml.
    "RUSTSEC-2026-0387",
    # RUSTSEC-2026-0374, `basic-toml` unmaintained: `age`'s translations'
    # macros read their own configuration with it while the server is
    # compiled. Nothing of it runs in the server, and it reads only that
    # file. Kept in step with deny.toml.
    "RUSTSEC-2026-0374",
]
