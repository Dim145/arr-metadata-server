name: Bug report
description: The server does something it should not, or does not do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. A report that says which version, which database, which client and what the log said is one that can be fixed.

        If this is a **security problem**, please do not report it here: use [private vulnerability reporting](https://github.com/Dim145/arr-metadata-server/security/advisories/new) instead. The [security policy](https://github.com/Dim145/arr-metadata-server/security/policy) says how.

  - type: input
    id: version
    attributes:
      label: Version
      description: What `arr-metadata-server --version` prints, or the tag of the image you run (`docker run --rm ghcr.io/dim145/arr-metadata-server --version` asks the image).
      placeholder: 0.8.3
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      description: What `AMS_DATABASE_URL` points at.
      options:
        - SQLite
        - PostgreSQL
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: What `AMS_MODE` is set to. `single` is the default.
      options:
        - Single instance (AMS_MODE=single)
        - Several instances (AMS_MODE=multi)
    validations:
      required: true

  - type: dropdown
    id: clients
    attributes:
      label: Clients involved
      description: Whoever was calling the server when it went wrong. Pick every one that applies.
      multiple: true
      options:
        - Sonarr
        - Radarr
        - Jellyseerr or Overseerr
        - Another TMDB client
        - Yamtrack
        - Jellyfin's TheTVDB plugin
        - An anime tracker (AniList)
        - The web interface
        - The native API
        - None of them
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: What you saw, and what you thought you would see instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As few as it takes, starting from a state somebody else can reach. The configuration that matters (the `AMS_*` variables, never the keys or passwords) helps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server's log around the moment it went wrong. `AMS_LOG=debug` says more than the default. Take out API keys, passwords and any address you would rather not publish.
      render: text
