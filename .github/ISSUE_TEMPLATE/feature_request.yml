name: Feature request
description: Something the server cannot do yet, or does in a way that gets in the way.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. A request that starts from what you are trying to do, rather than from the feature you picture, is easier to meet well.

        A question about running the server, or an idea that has no shape yet, belongs in the [discussions](https://github.com/Dim145/arr-metadata-server/discussions).

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, and what stands in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How it might work, from where you sit — a setting, a screen, a field in the API, a behaviour towards a client.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried, or considered?
      description: Another way to get there, and why it does not.

  - type: dropdown
    id: area
    attributes:
      label: Where it would live
      multiple: true
      options:
        - The compatibility surfaces (Sonarr/Radarr/TMDB)
        - The web interface
        - The administration
        - Data sources and merging
        - Authentication and access
        - Deployment and operation
        - Something else

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I looked through the open and closed issues, the discussions and the README, and did not find this.
          required: true
        - label: I would be willing to send a patch for it.
