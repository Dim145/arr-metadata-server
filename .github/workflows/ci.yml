# Read by both GitHub Actions and Gitea/Forgejo Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository, opens a pull request
# or publishes a package. A public repository hands this token to every fork's
# pull request, so it is worth saying rather than inheriting.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the target directory and nothing here reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The schema is maintained separately per engine, so CI has to apply both.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ams
          POSTGRES_PASSWORD: ams
          POSTGRES_DB: ams
        options: >-
          --health-cmd "pg_isready -U ams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Apply migrations on SQLite
        run: |
          ./scripts/smoke.sh "sqlite://$(mktemp -d)/ci.db?mode=rwc"

      - name: Apply migrations on PostgreSQL
        run: |
          ./scripts/smoke.sh "postgres://ams:ams@127.0.0.1:5432/ams"

  frontend:
    name: Web UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: arr-metadata-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and check it answers
        run: |
          docker run -d --name ci -p 8080:8080 \
            -e AMS_ADMIN_USERNAME=ci \
            -e AMS_ADMIN_PASSWORD=ci-password-long-enough \
            -e AMS_REFRESH_ENABLED=false \
            --read-only --tmpfs /tmp --tmpfs /data:uid=65532,gid=65532 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            arr-metadata-server:ci

          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done

          # Whatever kept it from answering is in its log.
          curl -fsS http://127.0.0.1:8080/health || { docker logs ci; exit 1; }
          curl -fsS http://127.0.0.1:8080/ready
          # The UI must be embedded, not the placeholder page.
          curl -fsS http://127.0.0.1:8080/ | grep -q '/assets/' \
            || { echo "the web UI was not embedded"; exit 1; }
          docker exec ci /usr/local/bin/arr-metadata-server healthcheck

          docker rm -f ci
