# Read by both GitHub Actions and Gitea/Forgejo Actions.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repository, opens a pull request
# or publishes a package. A public repository hands this token to every fork's
# pull request, so it is worth saying rather than inheriting.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info is the bulk of the target directory and nothing here reads it.
  CARGO_PROFILE_DEV_DEBUG: 0

# A newer push to a pull request makes its older run moot; every push to
# main is checked to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      # The schema is maintained separately per engine, so CI has to apply both.
      postgres:
        # Pinned by its digest, the tag kept for the reader; `docker buildx imagetools
        # inspect <tag>` gives the next one.
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: ams
          POSTGRES_PASSWORD: ams
          POSTGRES_DB: ams
        options: >-
          --health-cmd "pg_isready -U ams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked

      - name: Apply migrations on SQLite
        run: |
          ./scripts/smoke.sh "sqlite://$(mktemp -d)/ci.db?mode=rwc"

      - name: Apply migrations on PostgreSQL
        run: |
          ./scripts/smoke.sh "postgres://ams:ams@127.0.0.1:5432/ams"

  # `cargo test` above runs on SQLite alone, and the two engines disagree where
  # nothing in Rust checks: SQLite ignores what a bind is typed as and
  # PostgreSQL does not, which is how a missing rating once stored nothing and
  # a SUM came back as a type no driver here reads. So the tests that open a
  # database run again against a PostgreSQL, each on a database of its own
  # that is made for it and dropped with it (src/db/testing.rs), and so does
  # the one that says the two migration sets build the same schema
  # (src/db/parity.rs), which needs both engines.
  #
  # Named by module path: `db::` alone would take `tvdb::` and `tmdb::` with
  # it. A module whose tests open a database through src/db/testing.rs — or
  # build the whole server on one, as the native API's handlers do — joins
  # the list when it is written.
  test-postgres:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned by its digest, the tag kept for the reader; `docker buildx imagetools
        # inspect <tag>` gives the next one.
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_USER: ams
          POSTGRES_PASSWORD: ams
          POSTGRES_DB: ams
          # As compose.postgres.yaml starts it: a collation of its own rather
          # than the host's, which is what the order of an index follows.
          POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=und-x-icu
        options: >-
          --health-cmd "pg_isready -U ams"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      # A test makes a database on this server and drops it again, so the user
      # has to be allowed to; the container's own is.
      AMS_TEST_DATABASE_URL: postgres://ams:ams@127.0.0.1:5432/ams

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: >-
          cargo test --locked --
          db::repo:: db::parity:: db::testing::
          api::native:: api::plex:: api::relay::
          arr::history:: jobs::update_check::
          service:: settings::reference:: tls::ca::

  # How much of the crate its tests reach, for whoever wonders: informative,
  # never a gate — a threshold on a figure nobody has read only gets switched
  # off. The summary is in the log and `lcov.info` is kept a week, for an
  # editor or `genhtml` to read. On SQLite, as the backend job's tests are.
  coverage:
    name: Coverage (informative)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        uses: ./.github/actions/rust-toolchain
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Measure
        run: cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Summarise
        run: cargo llvm-cov report --summary-only

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  frontend:
    name: Web UI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      # Playwright compiles the suite without checking its types, and `tsc -b`
      # above reads the interface's project alone: this reads the suite's.
      - name: Typecheck the end-to-end suite
        working-directory: frontend
        run: npm run typecheck:e2e

      # The interface's types are generated from the server's spec. `cargo test`
      # fails while frontend/openapi.json is not the spec the server builds;
      # this fails while the types are not what that copy generates.
      - name: Generated types
        working-directory: frontend
        run: |
          npm run types
          git diff --exit-code -- src/lib/api.gen.ts || {
            echo "::error file=frontend/src/lib/api.gen.ts::Not what openapi.json generates: run npm run types in frontend/ and commit the result."
            exit 1
          }

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  # The interface as a visitor and an administrator meet it: the Rust binary,
  # serving the interface built beside it, driven by the Playwright suite in
  # frontend/e2e. The suite reads a catalogue it does not make — the providers
  # fill one, through scripts/e2e-seed.sh — so the job needs a TMDB key and a
  # TheTVDB one, as the repository secrets TMDB_API_KEY and TVDB_API_KEY
  # (FANARTTV_API_KEY adds the artwork, and may be left out). A pull request
  # from a fork is given no secrets, nor is Dependabot's: the job says so and
  # stands aside there, rather than fail for something nobody's change did.
  #
  # The administrator is made for the run: a name and a password drawn here,
  # given to the server and to the suite alike, and kept out of the log.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      # The cache's second tier, which the cache spec reads back; the server is
      # pointed at it below. Without one that spec checks the memory tier alone.
      cache:
        # Pinned by its digest, the tag kept for the reader; `docker buildx imagetools
        # inspect <tag>` gives the next one.
        image: valkey/valkey:8-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      # Said before anything is fetched or built, so that a run without the keys
      # costs a few seconds. A secret cannot be tested in an `if`, which is why
      # it is an environment variable here, and why the answer is an output.
      - name: Look for the provider keys
        id: keys
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          if [ -n "$TMDB_API_KEY" ] && [ -n "$TVDB_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=End-to-end tests skipped::TMDB_API_KEY and TVDB_API_KEY are repository secrets, and this run was not given them (a pull request from a fork is not)."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: steps.keys.outputs.present == 'true'

      - name: Install the toolchain
        if: steps.keys.outputs.present == 'true'
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.keys.outputs.present == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.keys.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web UI's dependencies
        if: steps.keys.outputs.present == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # The binary serves the interface from frontend/dist, so that is built
      # first: without it the build below embeds a placeholder page.
      - name: Build the web UI
        if: steps.keys.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      # The crate stays a debug build and its dependencies do not. Hashing a
      # password with argon2, and making the thumbnails the media worker keeps
      # of every picture the catalogue holds, are a fraction of their speed
      # unoptimized, and every administrator test signs in while the worker is
      # at it: on a runner this small that would be the suite's slowness, not
      # the interface's.
      - name: Build the server
        if: steps.keys.outputs.present == 'true'
        run: cargo build --locked --config 'profile.dev.package."*".opt-level = 2'

      - name: Install the browser
        if: steps.keys.outputs.present == 'true'
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Make this run's administrator
        if: steps.keys.outputs.present == 'true'
        run: |
          password="$(openssl rand -hex 24)"
          # A throwaway password, for a server that lives and dies in this job:
          # masked as a courtesy, nothing relies on it staying unseen.
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::${password}"
          {
            echo "E2E_DIR=${RUNNER_TEMP}/e2e"
            echo "AMS_E2E_USER=e2e-$(openssl rand -hex 4)"
            echo "AMS_E2E_PASSWORD=${password}"
          } >> "$GITHUB_ENV"

      # What the suite expects of the server (frontend/playwright.config.ts and
      # frontend/e2e/README.md): a public site, the limits lifted that one
      # address would otherwise meet, a public URL for the sign-in through an
      # identity provider to come back to, a store for the media, a door for
      # the clients, and the cache's second tier. In the background, its log
      # kept for the step that shows it when something failed.
      - name: Start the server
        if: steps.keys.outputs.present == 'true'
        env:
          AMS_TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          AMS_TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
          AMS_FANART_API_KEY: ${{ secrets.FANARTTV_API_KEY }}
          # The sources a new database has switched off — each is a party the
          # server would talk to, and that is the operator's call — and that
          # the suite's catalogue was made with on: a Fan-Kai cannot be
          # imported without Fan-Kai, nor an anime's relations read without
          # AniList and MyAnimeList.
          AMS_FANKAI_ENABLED: 'true'
          AMS_FANKAI_WIKI_ENABLED: 'true'
          AMS_ANILIST_ENABLED: 'true'
          AMS_MAL_ENABLED: 'true'
          AMS_TVMAZE_ENABLED: 'true'
          AMS_IMDB_ENABLED: 'true'
        run: |
          mkdir -p "$E2E_DIR/media" "$E2E_DIR/tls"
          AMS_DATABASE_URL="sqlite://$E2E_DIR/e2e.db?mode=rwc" \
          AMS_BIND_ADDRESS=127.0.0.1:8479 \
          AMS_PUBLIC_URL=http://127.0.0.1:8479 \
          AMS_PUBLIC_BROWSE=true \
          AMS_RATE_LIMIT_PER_MINUTE=6000 \
          AMS_SIGNUPS_PER_HOUR=1000 \
          AMS_SIGNUPS_PER_HOUR_TOTAL=1000 \
          AMS_CLIENTS_BIND=127.0.0.1:8443 \
          AMS_TLS_DIR="$E2E_DIR/tls" \
          AMS_REDIS_URL=redis://127.0.0.1:6379 \
          AMS_MEDIA_STORAGE=filesystem \
          AMS_MEDIA_DIR="$E2E_DIR/media" \
          AMS_ADMIN_USERNAME="$AMS_E2E_USER" \
          AMS_ADMIN_PASSWORD="$AMS_E2E_PASSWORD" \
            nohup ./target/debug/arr-metadata-server > "$E2E_DIR/server.log" 2>&1 &

          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:8479/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8479/ready | grep -q '"database":true'

      - name: Fill the catalogue
        if: steps.keys.outputs.present == 'true'
        run: ./scripts/e2e-seed.sh

      # The suite's own projects, in its own order: what runs at the width of a
      # desktop, then what changes how the whole server answers — a private
      # site, an API switched off — alone, once nothing else is running. The
      # phone-width project runs the same specs again at 375 pixels; it is not
      # run here.
      - name: Run the interface tests
        if: steps.keys.outputs.present == 'true'
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: ./node_modules/.bin/playwright test --project desktop --reporter=line,html

      - name: Run the tests that change the whole server
        if: steps.keys.outputs.present == 'true'
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: ./node_modules/.bin/playwright test --project server-wide --no-deps --reporter=line,html

      # What the server said, in the log of the run, where a secret it might
      # have named is masked. The artifact below holds the browser's side only.
      - name: Show the server's log
        if: ${{ failure() && steps.keys.outputs.present == 'true' }}
        run: |
          echo "::group::server.log"
          cat "$E2E_DIR/server.log" || true
          echo "::endgroup::"

      - name: Keep the report and the traces
        if: ${{ failure() && steps.keys.outputs.present == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The interface as pictures (frontend/e2e/visual.spec.ts): every gallery of
  # the styleguide, and a few pages as a visitor and an administrator first
  # meet them, held to the pictures in frontend/e2e/__screenshots__. On a
  # runner of its own, apart from the end-to-end job, whose accessibility
  # scan already strains a small runner: a picture taken under load is a
  # slower one, and a timeout fails a run all the same. It needs no secret —
  # the pages are drawn on an empty catalogue — so a fork's pull request is
  # held to the pictures too.
  #
  # The pictures are drawn in the official Playwright image of the version
  # package-lock.json pins, and nowhere else (CONTRIBUTING.md): the browser
  # and the suite run inside it, against the server this runner builds and
  # starts, on the runner's own network. A change that means to change a
  # picture draws them again with visual-update.yml, which opens a pull
  # request with the ones that moved.
  visual:
    name: Visual regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the web UI's dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # The styleguide is in a build asked for it alone; what ships leaves it
      # out. The binary reads frontend/dist from disk, being a debug build.
      - name: Build the web UI with its styleguide
        working-directory: frontend
        run: npx vite build --mode styleguide

      - name: Build the server
        run: cargo build --locked --config 'profile.dev.package."*".opt-level = 2'

      # The image of the version the suite was installed at, fetched before
      # the server starts: the dashboard's picture is the one a server shows
      # in its first ten minutes (visual.spec.ts says why).
      - name: Fetch the Playwright image
        run: |
          version="$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")"
          echo "PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v${version}-noble" >> "$GITHUB_ENV"
          docker pull "mcr.microsoft.com/playwright:v${version}-noble"

      # The administrator's name is in a picture, so it is fixed; its password
      # is drawn here and kept out of the log.
      - name: Make this run's administrator
        run: |
          password="$(openssl rand -hex 24)"
          # A throwaway password, for a server that lives and dies in this job:
          # masked as a courtesy, nothing relies on it staying unseen.
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::${password}"
          {
            echo "VISUAL_DIR=${RUNNER_TEMP}/visual"
            echo "AMS_E2E_USER=admin"
            echo "AMS_E2E_PASSWORD=${password}"
          } >> "$GITHUB_ENV"

      # As the pictures were drawn: a new database, a public site, no provider
      # key, no refresh, and nothing else from the environment.
      - name: Start the server
        run: |
          mkdir -p "$VISUAL_DIR/media"
          env -i PATH="$PATH" HOME="$HOME" \
            AMS_DATABASE_URL="sqlite://$VISUAL_DIR/visual.db?mode=rwc" \
            AMS_BIND_ADDRESS=127.0.0.1:8503 \
            AMS_PUBLIC_URL=http://127.0.0.1:8503 \
            AMS_PUBLIC_BROWSE=true \
            AMS_RATE_LIMIT_PER_MINUTE=6000 \
            AMS_REFRESH_ENABLED=false \
            AMS_MEDIA_STORAGE=filesystem \
            AMS_MEDIA_DIR="$VISUAL_DIR/media" \
            AMS_ADMIN_USERNAME="$AMS_E2E_USER" \
            AMS_ADMIN_PASSWORD="$AMS_E2E_PASSWORD" \
            nohup ./target/debug/arr-metadata-server > "$VISUAL_DIR/server.log" 2>&1 &

          for _ in $(seq 1 90); do
            curl -sf -o /dev/null http://127.0.0.1:8503/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8503/ready | grep -q '"database":true'

      - name: Compare the pictures
        run: |
          docker run --rm --ipc=host --network host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e AMS_E2E_URL=http://127.0.0.1:8503 -e AMS_E2E_USER -e AMS_E2E_PASSWORD \
            -v "$PWD:/work" -w /work/frontend \
            "$PLAYWRIGHT_IMAGE" \
            ./node_modules/.bin/playwright test --project visual --reporter=line

      - name: Show the server's log
        if: ${{ failure() }}
        run: |
          echo "::group::server.log"
          cat "$VISUAL_DIR/server.log" || true
          echo "::endgroup::"

      # Each picture that differs, beside the one it was held to and a
      # picture of the difference.
      - name: Keep the differences
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-differences
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  # `rust-version` in Cargo.toml promises that 1.94 builds this, and nothing
  # else ever tries it: a dependency, or a newer language feature, can break the
  # promise without anyone noticing. The version installed is read from
  # Cargo.toml, so when the promise moves, this moves with it.
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared minimum
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the declared minimum
        uses: ./.github/actions/rust-toolchain
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check
        run: cargo check --locked --all-targets

  # The dependency tree as a whole: the licences it is under, where its crates
  # come from, what is in it twice, and which of it has a known advisory. The
  # first three change only when somebody changes the dependencies, so they fail
  # the run. Advisories are published whenever their authors like, not when a
  # pull request is, and failing on one here would turn every open pull request
  # red for something none of them did: they are reported, and it is audit.yml
  # — when Cargo.lock changes, and every week — that fails on one.
  deny:
    name: Dependencies (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - bans licenses sources
          - advisories
    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # The one job that may write to code scanning, for the scan of the image
    # below. Naming a permission replaces the workflow's, so `contents` again.
    permissions:
      contents: read
      security-events: write # the scan's findings, filed under code scanning

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: arr-metadata-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it and check it answers
        run: |
          docker run -d --name ci -p 8080:8080 \
            -e AMS_ADMIN_USERNAME=ci \
            -e AMS_ADMIN_PASSWORD=ci-password-long-enough \
            -e AMS_REFRESH_ENABLED=false \
            --read-only --tmpfs /tmp --tmpfs /data:uid=65532,gid=65532 \
            --security-opt no-new-privileges:true --cap-drop ALL \
            arr-metadata-server:ci

          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:8080/health && break
            sleep 1
          done

          # Whatever kept it from answering is in its log.
          curl -fsS http://127.0.0.1:8080/health || { docker logs ci; exit 1; }
          curl -fsS http://127.0.0.1:8080/ready
          # The UI must be embedded, not the placeholder page.
          curl -fsS http://127.0.0.1:8080/ | grep -q '/assets/' \
            || { echo "the web UI was not embedded"; exit 1; }
          docker exec ci /usr/local/bin/arr-metadata-server healthcheck

          docker rm -f ci

      # What the image carries that is known to be vulnerable and has a fix: the
      # packages of the distroless base, and the crates inside the binary, which
      # lists them itself (`cargo auditable`, in the Dockerfile). Reported, not
      # enforced: the first scan is what shows how much there is to clear, and a
      # gate on a list nobody has read only gets switched off. Once it comes back
      # clean, `exit-code: '1'` makes it one.
      #
      # Only on a push, and only on GitHub: code scanning is GitHub's, and a
      # pull request from a fork, or from Dependabot, is given a token that
      # cannot write to it.
      - name: Scan the image
        id: trivy
        if: ${{ github.event_name == 'push' && github.server_url == 'https://github.com' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arr-metadata-server:ci
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          # Without this the severities above would not apply to the SARIF,
          # which lists everything by default.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '0'

      - name: Send the findings to code scanning
        if: ${{ steps.trivy.conclusion == 'success' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image
