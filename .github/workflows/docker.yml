# Builds the container image and publishes it to this repository's registry
# on GitHub, ghcr.io/<owner>/arr-metadata-server, when a version is tagged:
# `v1.2.3` becomes `1.2.3`, `1.2` and `latest`. A push to main publishes
# nothing — ci.yml builds the image there and throws it away — and a run
# started by hand publishes under the branch's name alone, never `latest`.
# Each platform is built on a runner of its own kind — no emulation, which
# a Rust build with fat LTO would take hours under — and the two are joined
# into one multi-platform image at the end.
#
# The image is published with what is needed to check it: an SBOM and the
# build's provenance, kept in the registry beside each platform's image; a
# keyless signature on the joined image, by digest; and GitHub's attestation of
# where it was built from. "Verifying the image", in the README, has the
# commands.
name: Publish the image

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

# Nothing for the workflow as a whole: each job names what it needs.
permissions: {}

# A push that lands while the previous one is still building takes its place.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Each platform's image is pushed by its digest: the token writes
    # packages and nothing else.
    permissions:
      contents: read
      packages: write # this platform's image, pushed by its digest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The registry wants the name in lower case, whatever the repository's.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The labels every layer carries: the source, the revision, the licence.
      - name: Describe the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest, untagged: the tags go on the joined image below.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The dependency layers, kept between releases, per platform, in the
          # registry beside the image (`buildcache-amd64`, `buildcache-arm64`).
          # Not in the Actions cache: what a tag writes there is that tag's
          # alone, so the next release could never read it, and its gigabytes
          # pushed the branches' caches out of the repository's ten.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          # What the image is made of and how it was built, stored in the
          # registry beside it. The digest of the build is therefore that of an
          # index holding the image and these two, and the join below takes all
          # of it. At `max` the provenance carries the Dockerfile and the build
          # arguments, in a public repository: there are no arguments here, and
          # no secret may ever be passed as one.
          sbom: true
          provenance: mode=max

      # The digest of that index: the image and its attestations together.
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: build
    # What the builds have, and what they do not need: an identity to sign
    # with, and the right to store an attestation.
    permissions:
      contents: read
      packages: write # the manifest that names both platforms
      id-token: write # an identity to sign the image with
      attestations: write # the build's provenance, kept beside the image

    steps:
      # The registry wants the name in lower case, whatever the repository's.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Tag the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image under every tag, the platforms' digests joined.
      - name: Join the platforms under the tags
        working-directory: /tmp/digests
        run: |
          tags=()
          while IFS= read -r tag; do tags+=(-t "$tag"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digests=()
          for digest in *; do digests+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"

      # The digest the tags now point at. What follows is done by digest: a tag
      # can be moved to another image once it has been signed, a digest cannot.
      - name: Say what was published
        id: published
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          inspection="$(docker buildx imagetools inspect "$IMAGE:$VERSION")"
          echo "$inspection"
          digest="$(awk '/^Digest:/ { print $2; exit }' <<< "$inspection")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest in what was published: '$digest'"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Each platform's image was pushed with its SBOM and its provenance beside
      # it, and the join is meant to carry them into the one index: they show in
      # `docker buildx imagetools inspect` as an `unknown/unknown` entry per
      # platform, annotated `vnd.docker.reference.type: attestation-manifest`.
      # Were they ever missing, what is signed below would say nothing of what
      # is in the image, so stop here.
      - name: Check that the attestations came through the join
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw | jq -e '
            [.manifests[] | .annotations["vnd.docker.reference.type"]] as $types
            | ([$types[] | select(. == "attestation-manifest")] | length) as $attestations
            | (($types | length) - $attestations) as $images
            | $images > 0 and $attestations == $images
          ' > /dev/null || { echo "the joined image does not carry an attestation manifest for each of its platforms"; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # No key to keep: the signature is made with the identity GitHub gives
      # this run, which names this workflow and the tag it ran for.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.published.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest where it was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
          # The record that lists the image among the repository's linked
          # artifacts takes one more permission, and nothing here reads that list.
          create-storage-record: false
