[package]
name = "arr-metadata-server"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
description = "Self-hosted, provider-agnostic metadata server compatible with the *arr stack, TMDB clients and manual curation."
license = "MIT"
repository = "https://github.com/Dim145/arr-metadata-server"
default-run = "arr-metadata-server"

[[bin]]
name = "arr-metadata-server"
path = "src/main.rs"

[dependencies]
# ── HTTP server ──────────────────────────────────────────────────────────────
axum = { version = "0.8.9", features = ["macros", "http2", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "cookie-private"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = [
    "trace", "cors", "compression-gzip", "compression-br", "normalize-path",
    "set-header", "timeout", "request-id", "catch-panic", "limit",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync"] }
hyper = "1.8"
http-body-util = "0.1.5"
bytes = "1.12.1"

# ── TLS ──────────────────────────────────────────────────────────────────────
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }

# ── HTTP client ──────────────────────────────────────────────────────────────
reqwest = { version = "0.13.5", default-features = false, features = [
    "json", "rustls", "gzip", "brotli", "stream", "charset", "http2", "query",
] }

# ── Database ─────────────────────────────────────────────────────────────────
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "any", "sqlite", "postgres",
    # `macros` is what provides `sqlx::migrate!`; `migrate` alone only ships the runtime.
    "macros", "migrate", "json",
] }

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3"

# ── Observability ────────────────────────────────────────────────────────────
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# ── Errors ───────────────────────────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.20"

# ── Security ─────────────────────────────────────────────────────────────────
# Default features already pull in `alloc`, `getrandom` and `password-hash`,
# which is everything the PHC-string API needs.
argon2 = "0.6.0"
getrandom = "0.4.3"
base64 = "0.23.1"
sha2 = "0.11.0"
subtle = "2.6.1"
# Signing in through an identity provider. No default features: its reqwest
# is an older one, and the requests go through this crate's own client
# (see `auth::oidc`), which never follows a redirect.
openidconnect = { version = "4.0.1", default-features = false }
# The lifetime of the cookie a sign-in through the provider travels in; the
# version the cookie crate already brings.
time = { version = "0.3.55", default-features = false, features = ["std", "formatting"] }
ipnet = { version = "2.12.2", features = ["serde"] }
governor = "0.10.4"

# ── Utilities ────────────────────────────────────────────────────────────────
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.26.1", features = ["v4", "v7", "serde"] }
futures = "0.3.34"
# IMDb publishes its datasets gzipped; already built for reqwest's own gzip.
flate2 = "1.1.10"
moka = { version = "0.12.16", features = ["future"] }
slug = "0.1.6"
urlencoding = "2.1.3"
dotenvy = "0.15.7"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }

# ── OpenAPI ──────────────────────────────────────────────────────────────────
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
# Collects handlers and their `#[utoipa::path]` annotations into one spec, so a
# route cannot exist without appearing in the documentation.
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.0", features = ["axum", "vendored"] }
dns-lookup = "4.0.1"
parking_lot = "0.12.5"
url = "2.5.8"
# The media store: one interface over a directory and an S3-compatible bucket.
object_store = { version = "0.14.2", features = ["aws", "fs"] }
# What a downloaded or uploaded file is, from its first bytes, and how big a
# picture is, from its header alone.
infer = "0.22.0"
imagesize = "0.15.0"
# Thumbnails of the pictures kept, so a page of cards is not a page of
# originals. Only the formats posters come in.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
# The authority checks what it issued the way rustls will judge it.
rustls-webpki = { version = "0.103.15", features = ["aws-lc-rs", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
mimalloc = "0.1.52"
arc-swap = "1.9.2"
# The machine's name, to tell one instance from another among several.
whoami = { version = "2.1.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
# What axum's `Query` extractor parses with; used to test the same path.
serde_urlencoded = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Proc macros and build scripts run on the machine doing the build and are never
# shipped, so there is nothing to gain from stripping them — and on recent macOS
# a stripped proc-macro dylib is one `dlopen` refuses ("mis-aligned LINKEDIT
# string pool"), which failed every local release build inside sqlx's macros.
# The binary that ships is still stripped by the setting above.
[profile.release.build-override]
strip = false

[profile.dev]
# Keep incremental debug builds usable on a large dependency tree.
opt-level = 0
debug = 1
