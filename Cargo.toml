[package]
name = "arr-metadata-server"
version = "0.11.1"
edition = "2024"
rust-version = "1.95"
description = "Self-hosted, provider-agnostic metadata server compatible with the *arr stack, TMDB clients and manual curation."
license = "MIT"
repository = "https://github.com/Dim145/arr-metadata-server"
default-run = "arr-metadata-server"

[[bin]]
name = "arr-metadata-server"
path = "src/main.rs"

[dependencies]
# ── HTTP server ──────────────────────────────────────────────────────────────
axum = { version = "0.8.9", features = ["macros", "http2", "multipart"] }
axum-extra = { version = "0.12.6", features = ["typed-header", "cookie", "cookie-private"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = [
    "trace", "cors", "compression-gzip", "compression-br", "normalize-path",
    "set-header", "timeout", "request-id", "catch-panic", "limit",
] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "fs", "sync", "io-util"] }
hyper = "1.8"
http-body-util = "0.1.5"
bytes = "1.12.1"

# ── TLS ──────────────────────────────────────────────────────────────────────
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }

# ── HTTP client ──────────────────────────────────────────────────────────────
reqwest = { version = "0.13.5", default-features = false, features = [
    "json", "rustls", "gzip", "brotli", "stream", "charset", "http2", "query",
] }

# ── Database ─────────────────────────────────────────────────────────────────
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio", "tls-rustls-aws-lc-rs", "any", "sqlite", "postgres",
    # `macros` is what provides `sqlx::migrate!`; `migrate` alone only ships the runtime.
    "macros", "migrate", "json",
] }

# ── Serialization ────────────────────────────────────────────────────────────
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_with = "3"

# ── Observability ────────────────────────────────────────────────────────────
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
# Traces sent to an OpenTelemetry collector, Tempo or Jaeger over OTLP, when
# OTEL_EXPORTER_OTLP_ENDPOINT or OTEL_EXPORTER_OTLP_TRACES_ENDPOINT says where:
# nothing is built otherwise. Traces only, over HTTP and protobuf, sent by
# the blocking reqwest client the exporter's own thread runs; `internal-logs`
# is what says in this server's log that a batch could not be sent. The four
# move together: tracing-opentelemetry runs one minor ahead of the others,
# and Dependabot keeps them in one group (.github/dependabot.yml).
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls", "internal-logs",
] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
# Errors reported to a Sentry or a GlitchTip, when the settings name one: the
# client and its transport alone, over the reqwest already here. The error
# lines are handed to it by a layer of this server's own (src/telemetry/
# report.rs), so that a DSN changed in the settings takes effect at once;
# and no panic integration, which brings a backtrace symboliser for a binary
# whose symbols are stripped: a panic reaches the report as the error line
# the server's panic hook writes.
sentry = { version = "0.49.3", default-features = false, features = ["reqwest", "rustls"] }
# The level sqlx's pool says how long a connection took to come at, which
# the metrics read (src/metrics.rs); the version already in the tree.
log = "0.4.34"

# ── Errors ───────────────────────────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.20"

# ── Security ─────────────────────────────────────────────────────────────────
# Default features already pull in `alloc`, `getrandom` and `password-hash`,
# which is everything the PHC-string API needs.
argon2 = "0.6.0"
getrandom = "0.4.3"
base64 = "0.23.1"
sha2 = "0.11.0"
# Standard Webhooks' signature, HMAC-SHA256; the version already in the tree.
hmac = "0.13.0"
subtle = "2.6.1"
# Signing in through an identity provider. No default features: its reqwest
# is an older one, and the requests go through this crate's own client
# (see `auth::oidc`), which never follows a redirect.
openidconnect = { version = "4.0.1", default-features = false }
# The lifetime of the cookie a sign-in through the provider travels in; the
# version the cookie crate already brings.
time = { version = "0.3.55", default-features = false, features = ["std", "formatting"] }
ipnet = { version = "2.12.2", features = ["serde"] }
governor = "0.10.4"

# ── Utilities ────────────────────────────────────────────────────────────────
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
futures = "0.3.34"
# IMDb publishes its datasets gzipped; already built for reqwest's own gzip.
flate2 = "1.1.10"
moka = { version = "0.12.16", features = ["future"] }
slug = "0.1.6"
urlencoding = "2.1.3"
dotenvy = "0.15.7"
mime_guess = "2.0.5"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }

# ── OpenAPI ──────────────────────────────────────────────────────────────────
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
# Collects handlers and their `#[utoipa::path]` annotations into one spec, so a
# route cannot exist without appearing in the documentation.
utoipa-axum = "0.3.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
dns-lookup = "4.0.1"
parking_lot = "0.13.0"
url = "2.5.8"
# Sonarr's own title cleaning takes accents off through a canonical
# decomposition; the version sqlx's PostgreSQL driver already brings.
unicode-normalization = "0.1.25"
# And tells what a character is — a letter, a mark, a digit — the way .NET's
# `\w` does; again the version sqlx's PostgreSQL driver brings.
unicode-properties = { version = "0.1.4", default-features = false, features = ["general-category"] }
# The media store: one interface over a directory and an S3-compatible bucket.
object_store = { version = "0.14.2", features = ["aws", "fs"] }
# What a downloaded or uploaded file is, from its first bytes, and how big a
# picture is, from its header alone.
infer = "0.22.0"
imagesize = "0.15.0"
# The pictures kept, read in Rust for the copies made of them, so a page of
# cards is not a page of originals. Only the formats posters come in.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Those copies resized: Lanczos3, a transparent picture's colours weighed by
# its alpha, with the processor's SIMD.
fast_image_resize = { version = "6.1.0", default-features = false, features = ["std"] }
# And written as lossy WebP, which `image` does not write: libwebp's encoder,
# built from its C sources and called directly (src/media/encode.rs). Its
# decoder is never called.
libwebp-sys = "0.14.4"
# The night's AVIF copies: rav1e, in Rust. Its assembly is the `avif-asm`
# feature below, which the container image's build turns on.
ravif = { version = "0.13.0", default-features = false }
# What a picture is drawn as while it loads: a sketch in two dozen bytes.
thumbhash = "0.1.0"
# What a JPEG's placeholder is drawn from: the picture decoded small — an
# eighth of its sides, or a quarter — by the inverse transform itself, where
# `image`'s decoder draws it whole, tens of megabytes a picture for a sketch
# of a hundred pixels (src/media/file.rs). Pure Rust like the others. With
# rayon, on threads it is given: without it, it starts one for each of a
# picture's colours and lets it go, every picture.
jpeg-decoder = { version = "0.3", default-features = false, features = ["rayon"] }
# The two threads it is given, made once; the version rav1e already brings.
rayon = "1.12"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
# The authority checks what it issued the way rustls will judge it.
rustls-webpki = { version = "0.103.15", features = ["aws-lc-rs", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }
mimalloc = "0.1.52"
arc-swap = "1.9.2"
# The machine's name, to tell one instance from another among several.
whoami = { version = "2.1.3", default-features = false, features = ["std"] }

# ── Backups and the command line ─────────────────────────────────────────────
# The command line, its subcommands derived from types: `serve` when none is
# named, so the image's entrypoint keeps starting the server.
clap = { version = "4.6.7", features = ["derive"] }
# A password asked for at a terminal, never echoed, never an argument that a
# process list or a shell's history would keep.
rpassword = "7.5.4"
# An archive is a tar of its files, compressed with zstd. Neither the
# extended attributes nor the old zstd formats are anything a backup of this
# server writes or reads.
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.14.3", default-features = false }
# And, given a passphrase, encrypted as age writes it (scrypt), so that a
# copy kept elsewhere opens with this binary or with `age -d` alike: it holds
# the accounts' password hashes, the webhooks' secrets and, among several
# instances, the authority's private key.
age = { version = "0.12.1", default-features = false }
# A blocking reader and writer over a bucket's streams: the archive is
# written and read by the synchronous tar, zstd and age, off the runtime.
tokio-util = { version = "0.7.19", features = ["io", "io-util"] }

# ── MCP ──────────────────────────────────────────────────────────────────────
# The Model Context Protocol, for agents (src/mcp): the official SDK, its
# server and its Streamable HTTP transport alone. Pinned to a minor — it
# breaks every few months — and to 3.7 at least: 3.0 to 3.5 kept a cache an
# unauthenticated caller could grow without end (GHSA-4432-vg92-fqh6).
rmcp = { version = "~3.7", default-features = false, features = ["server", "transport-streamable-http-server"] }

[features]
# rav1e's assembly: an AVIF copy in less than half the time (see
# docs/media.md). On x86_64 it is NASM's to assemble, which a build then
# needs; on arm64 the C compiler does. Off by default, so that a build
# anywhere needs nothing but a C compiler; the Dockerfile turns it on.
avif-asm = ["ravif/asm"]

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
# What axum's `Query` extractor parses with; used to test the same path.
serde_urlencoded = "0.7"
# Reads back the XML the feeds and the `.nfo` documents are written as, so a
# test says they are well-formed rather than that they look it; the version
# the object store already brings.
quick-xml = "0.41"
# Reads the source for what the assembled spec no longer shows: two types
# filed under one schema name, a field always written yet documented as
# optional, a handler's operation id (src/api/mod.rs). The version utoipa's
# derive already brings.
syn = { version = "3.0.6", default-features = false, features = ["full", "parsing", "visit"] }
# The SDK's own client, which the MCP endpoint's tests talk to it with: over
# the reqwest already here, in plain HTTP.
rmcp = { version = "~3.7", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }

[profile.release]
opt-level = 3
# One optimisation over the whole program: the smallest and fastest binary,
# for some 4 GB at its last step. A local build short of memory asks for thin
# LTO instead (CONTRIBUTING.md); CI and the published image keep this one.
lto = "fat"
codegen-units = 1
# Unwind, not abort: a panic in one handler is a 500 for that request — what
# the CatchPanicLayers are there for, and what a task's JoinError assumes —
# rather than every connection dropped and the process gone.
panic = "unwind"
strip = "symbols"

# Proc macros and build scripts run on the machine doing the build and are never
# shipped, so there is nothing to gain from stripping them — and on recent macOS
# a stripped proc-macro dylib is one `dlopen` refuses ("mis-aligned LINKEDIT
# string pool"), which failed every local release build inside sqlx's macros.
# The binary that ships is still stripped by the setting above.
[profile.release.build-override]
strip = false

[profile.dev]
# Keep incremental debug builds usable on a large dependency tree.
opt-level = 0
debug = 1

# The picture codecs, unoptimised, take seconds over a poster the release
# takes milliseconds over — minutes for an AVIF — which the tests and a
# debug server would wait on. None of them is this crate's own code.
[profile.dev.package.rav1e]
opt-level = 3
# Its hot loops are full of debug assertions, which alone make an AVIF
# twenty times slower.
debug-assertions = false
overflow-checks = false
[profile.dev.package.ravif]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.v_frame]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.av1-grain]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.bitstream-io]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.fast_image_resize]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
