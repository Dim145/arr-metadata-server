# A worked example: Sonarr, Radarr and Jellyseerr all served by this metadata
# server instead of by the public ones.
#
# Prerequisites
#   A .env with AMS_TMDB_API_KEY, AMS_ADMIN_USERNAME, AMS_ADMIN_PASSWORD
#   (and, recommended, TVDB_API_KEY and FANARTTV_API_KEY)
#
# Run
#   docker compose -f compose.integration.yaml up -d
#
# How it works: each client resolves the metadata hostname it has compiled in to
# this server's address on the shared network (extra_hosts), and trusts the
# authority the server made on its first start — fetched from the server over
# the stack's own network as the client starts (Sonarr, Radarr), or mounted as
# a file downloaded once from the administration page (Jellyseerr). Nothing in
# the clients is reconfigured — they cannot be. See docs/integration.md.

services:
  metadata:
    build: .
    image: ghcr.io/dim145/arr-metadata-server:latest
    container_name: arr-metadata-server
    restart: unless-stopped

    environment:
      # The web UI and the native API, plain: on the host, or behind your own
      # reverse proxy.
      AMS_BIND_ADDRESS: 0.0.0.0:8080
      # The clients' door: TLS on the port they expect, with a certificate the
      # server issues itself. The authority lands in /data/tls.
      AMS_CLIENTS_BIND: 0.0.0.0:443
      AMS_DATABASE_URL: sqlite:///data/ams.db?mode=rwc
      AMS_TMDB_API_KEY: ${AMS_TMDB_API_KEY:?AMS_TMDB_API_KEY is required}
      # TheTVDB settles the episode and season numbering, which is what Sonarr
      # matches files against. Optional, but without it anime is misnumbered.
      AMS_TVDB_API_KEY: ${AMS_TVDB_API_KEY:-${TVDB_API_KEY:-}}
      # Fanart.tv adds transparent logos, clearart and banners. Optional.
      AMS_FANART_API_KEY: ${AMS_FANART_API_KEY:-${FANARTTV_API_KEY:-}}
      AMS_ADMIN_USERNAME: ${AMS_ADMIN_USERNAME:?}
      AMS_ADMIN_PASSWORD: ${AMS_ADMIN_PASSWORD:?}
      AMS_ALLOWLIST: 172.31.0.0/24
      # Jellyseerr compiles its TMDB key in and cannot be given one of ours, so
      # its surface is guarded by address like Sonarr's and Radarr's.
      AMS_TMDB_AUTH: allowlist
      TZ: ${TZ:-UTC}

    volumes:
      - metadata-data:/data

    ports:
      # The web UI, on the host. The clients reach :443 over the shared network.
      - "${AMS_PORT:-8080}:8080"

    networks:
      stack:
        ipv4_address: 172.31.0.10

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    # 443 needs no privilege here: Docker lets a container's process bind any
    # port (net.ipv4.ip_unprivileged_port_start=0 in its namespace, since
    # 20.10). On an older engine, map "443:8443" and bind 8443 instead.

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    # Started once the server answers: the authority is fetched at start.
    depends_on:
      metadata:
        condition: service_healthy

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      # Where the init script below fetches the authority from: the server's
      # web door, over the stack's own network. Pin it, once known, with
      # AMS_CA_FINGERPRINT — the SHA-256 the administration page shows.
      AMS_CA_URL: http://172.31.0.10:8080/ca.crt

    volumes:
      - sonarr-config:/config
      # Fetching the authority is not enough: these images do not rebuild the
      # trust bundle on their own. The init script is what does it.
      - ./docker/trust-ca.sh:/custom-cont-init.d/10-trust-arr-metadata-ca:ro

    # Sonarr's metadata URL is compiled in; this is what redirects it.
    extra_hosts:
      - "skyhook.sonarr.tv:172.31.0.10"
      # Sonarr's alternate titles from this catalogue too: needs an authority
      # made for this name — a new stack's is; an older one is replaced first
      # (docs/integration.md, "Upgrading a server that is already running").
      # - "services.sonarr.tv:172.31.0.10"

    ports:
      - "${SONARR_PORT:-8989}:8989"
    networks: [stack]

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    depends_on:
      metadata:
        condition: service_healthy

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      AMS_CA_URL: http://172.31.0.10:8080/ca.crt

    volumes:
      - radarr-config:/config
      - ./docker/trust-ca.sh:/custom-cont-init.d/10-trust-arr-metadata-ca:ro

    extra_hosts:
      - "api.radarr.video:172.31.0.10"

    ports:
      - "${RADARR_PORT:-7878}:7878"
    networks: [stack]

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    depends_on:
      metadata:
        condition: service_healthy

    environment:
      # Node merges this PEM with its built-in roots, which is why this works on
      # the slim Alpine image without touching /etc/ssl. The file is the
      # authority downloaded once from Opening & APIs (or /ca.crt), put beside
      # this compose file.
      NODE_EXTRA_CA_CERTS: /etc/arr-metadata-ca.crt
      TZ: ${TZ:-UTC}

    volumes:
      # Jellyseerr logs "the /app/config volume mount was not configured
      # properly. All data will be cleared" on start. It is wrong here: it
      # decides by looking for a DOCKER marker file that its image ships in this
      # directory, and Docker copies an image's contents into a *named* volume
      # when it creates one, marker included. The database does survive a
      # restart — verified. A bind mount starts empty and silences the warning,
      # at the cost of host permissions to get right.
      - jellyseerr-config:/app/config
      - ./arr-metadata-ca.crt:/etc/arr-metadata-ca.crt:ro

    extra_hosts:
      - "api.themoviedb.org:172.31.0.10"

    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    networks: [stack]

networks:
  stack:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  metadata-data:
  sonarr-config:
  radarr-config:
  jellyseerr-config:
