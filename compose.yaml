# Default deployment: one container, SQLite, data in a named volume.
#
#   cp .env.example .env    # set AMS_TMDB_API_KEY and the admin credentials
#   docker compose up -d

services:
  metadata:
    build: .
    image: ghcr.io/dim145/arr-metadata-server:latest
    container_name: arr-metadata-server
    restart: unless-stopped

    environment:
      AMS_BIND_ADDRESS: 0.0.0.0:8080
      AMS_DATABASE_URL: sqlite:///data/ams.db?mode=rwc
      AMS_TMDB_API_KEY: ${AMS_TMDB_API_KEY:-}
      AMS_TMDB_LANGUAGE: ${AMS_TMDB_LANGUAGE:-en-US}
      AMS_TMDB_INCLUDE_ADULT: ${AMS_TMDB_INCLUDE_ADULT:-false}
      AMS_ADMIN_USERNAME: ${AMS_ADMIN_USERNAME:-}
      AMS_ADMIN_PASSWORD: ${AMS_ADMIN_PASSWORD:-}
      # Who may call the address-guarded surfaces, as a first value only: the
      # list is edited on the Access page from the first start on. Unset, it
      # starts as the private ranges and loopback.
      AMS_ARR_ALLOWLIST: ${AMS_ARR_ALLOWLIST:-}
      # The clients' door for Sonarr, Radarr and the TMDB relay: TLS on 443,
      # with a certificate the server issues itself. Map "443:443" below too;
      # no privilege is needed inside a container. See docs/integration.md.
      # AMS_CLIENTS_BIND: 0.0.0.0:443
      AMS_LOG: ${AMS_LOG:-info}
      TZ: ${TZ:-UTC}

    ports:
      - "${AMS_PORT:-8080}:8080"

    volumes:
      - metadata-data:/data

    # The image ships no shell and no package manager; nothing here needs one.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 512M

  # A second tier of cache, shared and kept across restarts: uncomment this
  # service and set AMS_REDIS_URL: redis://cache:6379 on the metadata server.
  # A cache and nothing else: a memory ceiling, the least recently used
  # evicted, no persistence. See Administration › Cache.
  # cache:
  #   image: valkey/valkey:8-alpine
  #   container_name: arr-metadata-cache
  #   restart: unless-stopped
  #   command: valkey-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save "" --appendonly no
  #   read_only: true
  #   security_opt:
  #     - no-new-privileges:true

volumes:
  metadata-data:
