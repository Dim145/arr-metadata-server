# Default deployment: one container, SQLite, data in a named volume.
#
#   cp .env.example .env    # set AMS_TMDB_API_KEY and the admin credentials
#   docker compose up -d

services:
  metadata:
    build: .
    image: arr-metadata-server:latest
    container_name: arr-metadata-server
    restart: unless-stopped

    environment:
      AMS_BIND_ADDRESS: 0.0.0.0:8080
      AMS_DATABASE_URL: sqlite:///data/ams.db?mode=rwc
      AMS_TMDB_API_KEY: ${AMS_TMDB_API_KEY:-}
      AMS_TMDB_LANGUAGE: ${AMS_TMDB_LANGUAGE:-en-US}
      AMS_TMDB_INCLUDE_ADULT: ${AMS_TMDB_INCLUDE_ADULT:-false}
      AMS_ADMIN_USERNAME: ${AMS_ADMIN_USERNAME:-}
      AMS_ADMIN_PASSWORD: ${AMS_ADMIN_PASSWORD:-}
      AMS_ARR_ALLOWLIST: ${AMS_ARR_ALLOWLIST:-172.16.0.0/12,10.0.0.0/8,192.168.0.0/16,127.0.0.0/8}
      # The clients' door for Sonarr, Radarr and the TMDB relay: TLS on 443,
      # with a certificate the server issues itself. Map "443:443" below too;
      # no privilege is needed inside a container. See docs/integration.md.
      # AMS_CLIENTS_BIND: 0.0.0.0:443
      AMS_LOG: ${AMS_LOG:-info}
      TZ: ${TZ:-UTC}

    ports:
      - "${AMS_PORT:-8080}:8080"

    volumes:
      - metadata-data:/data

    # The image ships no shell and no package manager; nothing here needs one.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  metadata-data:
