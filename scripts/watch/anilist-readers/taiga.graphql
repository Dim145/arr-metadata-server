# Taiga — its MediaFragment and MediaSearch, on master (the rewrite, last
# commit 2026-09-27). Written from what note D §2 of
# IMPROVEMENT_RESEARCH.d/remplacement-sources-2026-11 records it asks, not
# from its code: where the note names a field and not what is read below
# it, one subfield stands for the rest. Its account queries and mutations
# are left out.
fragment MediaFragment on Media {
  id
  title { romaji(stylised: true) english(stylised: true) native(stylised: true) }
  format
  status
  description
  startDate { year month day }
  endDate { year month day }
  episodes
  duration
  countryOfOrigin
  trailer { id site }
  updatedAt
  coverImage { large }
  genres
  synonyms
  averageScore
  popularity
  tags { name rank }
  studios { nodes { name } }
  nextAiringEpisode { airingAt episode }
}

query ($search: String, $season: MediaSeason, $year: Int) {
  Page {
    media(search: $search, season: $season, seasonYear: $year, format_in: [TV], status: RELEASING, sort: [POPULARITY_DESC], type: ANIME) {
      ...MediaFragment
    }
  }
}
